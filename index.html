<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Bubugao x BTN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background: url('background.png') no-repeat center center fixed; 
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 15px;
      position: relative;
      gap: 25px;
    }
    
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }
    
    .container, .table-container { 
      width: 100%;
      max-width: 540px; 
      background: #ffffff; 
      border-radius: 16px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .container { text-align: center; }
    
    .banner-box {
      width: 100%;
      height: auto;
      display: block;
      background-color: #f8f9fa;
    }
    .banner-box img {
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: cover;
      display: block;
    }
    
    .content-area { padding: 25px; }
    h1 { color: #004b87; font-size: 24px; font-weight: 800; margin-bottom: 5px; }
    .subtitle { color: #7f8c8d; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    
    .camera-container {
      width: 100%; max-width: 240px; height: 180px;
      margin: 0 auto 20px auto; border-radius: 12px;
      border: 3px solid #bdc3c7; background-color: #2c3e50;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    input { 
      width: 100%; padding: 15px; font-size: 22px; font-weight: bold;
      color: #2c3e50; border: 3px solid #bdc3c7; border-radius: 12px; text-align: center; 
    }
    input:focus { border-color: #004b87; outline: none; box-shadow: 0 0 15px rgba(0,75,135,0.4); }
    
    #statusBox { 
      margin-top: 20px; padding: 20px 15px; border-radius: 12px; 
      font-size: 20px; font-weight: bold; min-height: 80px;
      display: flex; align-items: center; justify-content: center;
    }
    .status-ready { background-color: #f1f2f6; color: #57606f; border: 2px solid #ced6e0; }
    .status-loading { background-color: #fef9e7; color: #d4ac0d; border: 2px solid #f9e79f; }
    .status-success { background-color: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }
    .status-error { background-color: #fadbd8; color: #78281f; border: 2px solid #f5b7b1; }

    /* === CSS TABEL LIVE LOG_HISTORY === */
    .table-container { padding: 20px; }
    .table-title { color: #004b87; font-size: 15px; font-weight: bold; margin-bottom: 10px; text-align: left; border-left: 4px solid #004b87; padding-left: 8px; }
    .table-wrapper { overflow-x: auto; width: 100%; max-height: 280px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; white-space: nowrap; }
    th { background-color: #f1f2f6; color: #57606f; padding: 10px; font-weight: bold; border-bottom: 2px solid #ced6e0; position: sticky; top: 0; }
    td { padding: 10px; border-bottom: 1px solid #f1f2f6; color: #2c3e50; }
    tr:hover { background-color: #f9f9f9; }
    .btn-link { color: #004b87; font-weight: bold; text-decoration: none; }
    .btn-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="banner-box">
      <img src="banner.png" alt="Banner Presensi">
    </div>
    <div class="content-area">
      <h1>PRESENSI BU BU GAO</h1>
      <div class="subtitle">Presented by BTN KC Agung Sedayu • ONLINE</div>
      
      <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
      </div>
      <canvas id="captureCanvas" style="display:none;"></canvas>
      
      <input type="text" id="barcodeInput" autofocus placeholder="SILAKAN SCAN KARTU" autocomplete="off">
      
      <div id="statusBox" class="status-ready">
        <span>📷 Kamera Siap, Silakan Scan...</span>
      </div>
    </div>
  </div>

  <div class="table-container">
    <div class="table-title">🔄 Data Real-Time LOG_HISTORY (Kolom A - E)</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="tableHeader">
            <th style="padding:10px; color:#7f8c8d;">Memuat nama kolom...</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="5" style="text-align:center; color:#7f8c8d; padding:20px;">⏳ Mengambil data LOG_HISTORY...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL Web App Apps Script Terbaru
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxs-ko9oSP4xnCnaeP4dRue8PXHXeqxjYvVqyfHBWz9zy9iQHFKNFIDNsteLkwhWWQ/exec";
    const GET_DATA_URL = WEB_APP_URL + "?action=laporan";

    const input = document.getElementById('barcodeInput');
    const statusBox = document.getElementById('statusBox');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('captureCanvas');

    // Aktifkan Kamera
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        statusBox.className = 'status-error';
        statusBox.innerHTML = '<span>⚠️ Gagal Akses Kamera: ' + err.message + '</span>';
      });

    document.addEventListener('click', () => input.focus());
    input.addEventListener('blur', () => setTimeout(() => input.focus(), 10));

    // Ambil Data LOG_HISTORY (Kolom A - E)
    async function muatTabelKehadiran() {
      try {
        const response = await fetch(GET_DATA_URL);
        const data = await response.json();
        if (data.error || !Array.isArray(data)) return;
        
        const headers = data[0];
        const rows = data.slice(1);
        
        // Render Header Tabel
        document.getElementById('tableHeader').innerHTML = headers.map(h => `<th>${h}</th>`).join('');
        
        const tbody = document.getElementById('tableBody');
        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${headers.length}" style="text-align:center; color:#aaa; padding:15px;">Belum ada data presensi di LOG_HISTORY.</td></tr>`;
          return;
        }
        
        // Render Isi Baris Data
        tbody.innerHTML = rows.map(row => {
          return `<tr>${row.map(cell => {
            // Otomatis ubah link Foto Drive (Kolom E) menjadi tombol link klik
            if (typeof cell === 'string' && (cell.startsWith('http://') || cell.startsWith('https://'))) {
              return `<td><a href="${cell}" target="_blank" class="btn-link">🖼️ Lihat Foto</a></td>`;
            }
            return `<td>${cell}</td>`;
          }).join('')}</tr>`;
        }).join('');
      } catch (e) {
        console.log("Gagal memuat tabel LOG_HISTORY: ", e);
      }
    }

    // Jalankan Scan Kartu (POST)
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const barcodeValue = input.value.trim();
        if (barcodeValue === "") return;

        statusBox.className = 'status-loading';
        statusBox.innerHTML = '<span>⏳ Memproses & Mengambil Foto...</span>';

        let photoDataUrl = "";
        try {
          const context = canvas.getContext('2d');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          photoDataUrl = canvas.toDataURL('image/jpeg', 0.5);
        } catch (err) { console.error(err); }

        input.value = '';

        fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ barcode: barcodeValue, image: photoDataUrl })
        })
        .then(() => {
          statusBox.className = 'status-success';
          statusBox.innerHTML = '<span>✅ BERHASIL DISIMPAN!<br><small>ID: ' + barcodeValue + '</small></span>';
          
          // Auto-refresh tabel real-time setelah scan sukses
          muatTabelKehadiran();

          setTimeout(() => {
            statusBox.className = 'status-ready';
            statusBox.innerHTML = '<span>📷 Kamera Siap, Silakan Scan...</span>';
          }, 2000);
          input.focus();
        })
        .catch(error => {
          statusBox.className = 'status-error';
          statusBox.innerHTML = '<span>❌ GAGAL: ' + error.message + '</span>';
          input.focus();
        });
      }
    });

    // Panggil penarikan data tabel saat halaman pertama kali dibuka
    muatTabelKehadiran();
  </script>
</body>
</html>
