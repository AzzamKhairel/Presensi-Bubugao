<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Bubugao x BTN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      /* === 1. SETTING BACKGROUND GAMBAR === */
      background: url('background.png') no-repeat center center fixed; 
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      position: relative;
    }
    
    /* Efek Lapisan Gelap di atas background agar kotak presensi tetap terlihat kontras/jelas */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5); /* 0.5 artinya kegelapan 50%. Ubah sesuai selera */
      z-index: 1;
    }
    
    .container { 
      width: 100%;
      max-width: 480px; 
      background: #ffffff; 
      border-radius: 16px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
      text-align: center;
      overflow: hidden; 
      position: relative;
      z-index: 2; /* Menaikkan posisi kotak di atas lapisan gelap background */
    }
    
    /* === 2. LAYOUT BANNER === */
    .banner-box {
      width: 100%;
      height: auto;
      display: block;
      background-color: #f8f9fa;
    }
    .banner-box img {
      width: 100%;
      height: auto;
      max-height: 140px; /* Batasi tinggi maksimal banner agar tidak terlalu besar */
      object-fit: cover; /* Memotong gambar secara proporsional jika terlalu panjang */
      display: block;
    }
    
    .content-area { padding: 25px; }
    h1 { color: #004b87; font-size: 24px; font-weight: 800; margin-bottom: 5px; }
    .subtitle { color: #7f8c8d; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    
    .camera-container {
      width: 100%; max-width: 240px; height: 180px;
      margin: 0 auto 20px auto; border-radius: 12px;
      border: 3px solid #bdc3c7; background-color: #2c3e50;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    
    input { 
      width: 100%; padding: 15px; font-size: 22px; font-weight: bold;
      color: #2c3e50; border: 3px solid #bdc3c7; border-radius: 12px; text-align: center; 
    }
    input:focus { border-color: #004b87; outline: none; box-shadow: 0 0 15px rgba(0,75,135,0.4); }
    
    #statusBox { 
      margin-top: 20px; padding: 20px 15px; border-radius: 12px; 
      font-size: 20px; font-weight: bold; min-height: 80px;
      display: flex; align-items: center; justify-content: center;
    }
    .status-ready { background-color: #f1f2f6; color: #57606f; border: 2px solid #ced6e0; }
    .status-loading { background-color: #fef9e7; color: #d4ac0d; border: 2px solid #f9e79f; }
    .status-success { background-color: #e8f8f5; color: #117a65; border: 2px solid #a3e4d7; }
    .status-error { background-color: #fadbd8; color: #78281f; border: 2px solid #f5b7b1; }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="banner-box">
      <img src="banner.png" alt="Banner Presensi">
    </div>
    
    <div class="content-area">
      <h1>PRESENSI BU BU GAO</h1>
      <div class="subtitle">Presented by BTN KC Agung Sedayu • ONLINE</div>
      
      <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
      </div>
      <canvas id="captureCanvas" style="display:none;"></canvas>
      
      <input type="text" id="barcodeInput" autofocus placeholder="SILAKAN SCAN KARTU" autocomplete="off">
      
      <div id="statusBox" class="status-ready">
        <span>📷 Kamera Siap, Silakan Scan...</span>
      </div>
    </div>
  </div>

  <script>
    // === MASUKKAN URL GOOGLE APPS SCRIPT (doPost) ANDA DI SINI ===
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDgF_hL1r-N7wEsYg40Lv9jAkc9rNPG4id2hCgNCovvp1e35Sl6XrhsRp258GtcTo/exec";

    const input = document.getElementById('barcodeInput');
    const statusBox = document.getElementById('statusBox');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('captureCanvas');

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        statusBox.className = 'status-error';
        statusBox.innerHTML = '<span>⚠️ Gagal Akses Kamera: ' + err.message + '</span>';
      });

    document.addEventListener('click', () => input.focus());
    input.addEventListener('blur', () => setTimeout(() => input.focus(), 10));

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const barcodeValue = input.value.trim();
        if (barcodeValue === "") return;

        statusBox.className = 'status-loading';
        statusBox.innerHTML = '<span>⏳ Memproses & Mengambil Foto...</span>';

        let photoDataUrl = "";
        try {
          const context = canvas.getContext('2d');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          photoDataUrl = canvas.toDataURL('image/jpeg', 0.5);
        } catch (err) { console.error(err); }

        input.value = '';

        fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ barcode: barcodeValue, image: photoDataUrl })
        })
        .then(() => {
          statusBox.className = 'status-success';
          statusBox.innerHTML = '<span>✅ BERHASIL DISIMPAN!<br><small>ID: ' + barcodeValue + '</small></span>';
          setTimeout(() => {
            statusBox.className = 'status-ready';
            statusBox.innerHTML = '<span>📷 Kamera Siap, Silakan Scan...</span>';
          }, 2000);
          input.focus();
        })
        .catch(error => {
          statusBox.className = 'status-error';
          statusBox.innerHTML = '<span>❌ GAGAL: ' + error.message + '</span>';
          input.focus();
        });
      }
    });
  </script>
</body>
</html>
